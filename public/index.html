<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123f3b">
  <title>Tikaymi · Marketing Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#inicio" aria-label="Tikaymi inicio">
        <img src="tikaymi-logo.png" alt="Tikaymi">
        <span><b>Tikaymi</b><small>Marketing Intelligence</small></span>
      </a>
      <nav id="tabs" aria-label="Navegación principal"></nav>
      <div class="sidebar-foot">
        <p>Decide con datos.<br>Crea con propósito.</p>
        <button id="logout" class="nav-link danger">Salir</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="mobile-head">
        <button id="menu" class="icon-btn" aria-label="Abrir menú">☰</button>
        <img src="tikaymi-logo.png" alt="Tikaymi">
        <span>Tikaymi Lab</span>
      </header>
      <div id="msg" role="status" aria-live="polite"></div>
      <main id="view"></main>
    </div>
  </div>
  <main id="login-view"></main>
  <script src="visual-contract.js"></script>
  <script src="searchable-select.js"></script>
  <script src="app.js"></script>

</html>
